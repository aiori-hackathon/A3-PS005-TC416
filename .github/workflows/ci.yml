name: HORA-Q CI / Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Test Suite & Cryptographic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite (50 Tests)
        working-directory: backend
        run: |
          pytest -v


      - name: Run Independent Evidence Verifier (Authentic Sample)
        run: |
          python verify_evidence.py audit/sample_evidence_signed.json

      - name: Verify Tamper Detection (Tamper Rejection Test)
        run: |
          # The verifier MUST return exit code 1 when tamper is simulated
          if python verify_evidence.py audit/sample_evidence_signed.json --tamper; then
            echo "ERROR: Verifier failed to detect tampering!"
            exit 1
          else
            echo "SUCCESS: Tamper detected as expected (exit code 1)."
          fi

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Compile & Build Production Bundle (tsc && vite build)
        working-directory: frontend
        run: |
          npm run build
